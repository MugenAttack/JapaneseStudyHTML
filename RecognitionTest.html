<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japanese Word Recognition Test</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --accent: #2563eb;
      --text: #0f172a;
      --border: #cbd5e1;
      --correct: #16a34a;
      --correct-bg: #dcfce7;
      --wrong: #dc2626;
      --wrong-bg: #fee2e2;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 12px;
      margin: 0;
    }

    .app-container {
      background: var(--card);
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
    }

    h1.title {
      text-align: center;
      font-size: 1.5rem;
      margin: 0 0 8px 0;
    }

    p.subtitle {
      text-align: center;
      color: #64748b;
      font-size: 0.95rem;
      margin: 0 0 16px 0;
    }

    .set-selector-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .set-select, .num-input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.95rem;
    }

    .num-input {
      width: 80px;
      text-align: center;
    }

    /* Screen Management */
    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* Setup Screen */
    .setup-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      margin-top: 10px;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
    }

    /* Progress Display */
    .progress-bar {
      text-align: center;
      font-weight: bold;
      color: #64748b;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .prompt-box {
      border: 2px solid var(--accent);
      background: #eff6ff;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .prompt-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #2563eb;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .prompt-word {
      font-size: 1.8rem;
      font-weight: bold;
      margin-top: 6px;
      color: #1e293b;
      text-transform: capitalize;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: #f8fafc;
    }

    .option-btn .jp-kanji {
      font-size: 1.3rem;
      font-weight: bold;
      color: #0f172a;
    }

    .option-btn .jp-kana {
      font-size: 0.95rem;
      color: #0284c7;
      font-weight: 600;
    }

    .option-btn .jp-romaji {
      font-size: 0.8rem;
      color: #64748b;
    }

    .option-btn.correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct) !important;
    }

    .option-btn.wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong) !important;
    }

    .btn-action {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-action:hover {
      background: #1d4ed8;
    }

    /* Results Screen */
    .results-section {
      margin-top: 16px;
    }

    .results-header {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
    }

    .word-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
      max-height: 350px;
      overflow-y: auto;
      padding: 4px;
    }

    .result-card {
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      border: 1px solid;
    }

    .result-card.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: #14532d;
    }

    .result-card.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: #7f1d1d;
    }

    .result-card .en {
      font-weight: bold;
      font-size: 0.9rem;
      text-transform: capitalize;
    }

    .result-card .jp {
      font-size: 1.1rem;
      margin-top: 2px;
    }

    .result-card .sub {
      font-size: 0.75rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div class="app-container">
  <h1 class="title">Recognition Test</h1>

  <!-- Setup Screen -->
  <div id="setup-screen" class="screen active">
    <p class="subtitle">Choose your practice set and question amount to start!</p>
    <div class="setup-box">
      <div class="set-selector-container">
        <label for="set-select">Practice Set:</label>
        <select id="set-select" class="set-select" onchange="loadSet(this.value)">
        </select>
      </div>

      <div class="input-group">
        <label for="num-questions">Questions:</label>
        <input type="number" id="num-questions" class="num-input" value="10" min="1" max="100">
      </div>

      <button class="btn-action" onclick="startTest()">Start Test</button>
    </div>
  </div>

  <!-- Test Screen -->
  <div id="test-screen" class="screen">
    <div class="progress-bar">
      Question <span id="current-q">1</span> of <span id="total-q">10</span>
    </div>

    <div class="prompt-box">
      <div id="prompt-category" class="prompt-category">Category</div>
      <div id="prompt-word" class="prompt-word">---</div>
    </div>

    <div id="options-grid" class="options-grid">
    </div>

    <button id="next-btn" class="btn-action" style="display: none;" onclick="nextQuestion()">Next Question</button>
  </div>

  <!-- Results Screen -->
  <div id="results-screen" class="screen">
    <div class="results-header" id="summary-header">Test Complete!</div>

    <div class="results-section">
      <div class="word-list" id="results-list"></div>
    </div>

    <button class="btn-action" onclick="restart()">Try Again</button>
  </div>
</div>

<script>
  let currentSetData = {};
  let unaskedWords = [];
  let currentTarget = null;

  let totalQuestions = 10;
  let currentQuestionIndex = 0;

  let correctResults = [];
  let wrongResults = [];

  const fallbackData = {
    "topic": [
      { "en": "doctor", "kanji": "医者", "kana": "いしゃ", "romaji": "isha" },
      { "en": "I", "kanji": "私", "kana": "わたし", "romaji": "watashi" },
      { "en": "lawyer", "kanji": "弁護士", "kana": "べんごし", "romaji": "bengoshi" },
      { "en": "student", "kanji": "学生", "kana": "がくせい", "romaji": "gakusei" },
      { "en": "I (used by men)", "kanji": "僕", "kana": "ぼく", "romaji": "boku" },
      { "en": "who", "kanji": "誰", "kana": "だれ", "romaji": "dare" }
    ],
    "time": [
      { "en": "today", "kanji": "今日", "kana": "きょう", "romaji": "kyou" },
      { "en": "tomorrow", "kanji": "明日", "kana": "あした", "romaji": "ashita" },
      { "en": "tonight", "kanji": "今晩", "kana": "こんばん", "romaji": "konban" },
      { "en": "weekend", "kanji": "週末", "kana": "しゅうまつ", "romaji": "shuumatsu" },
      { "en": "yesterday", "kanji": "昨日", "kana": "きのう", "romaji": "kinou" },
      { "en": "Tuesday", "kanji": "火曜日", "kana": "かようび", "romaji": "kayoubi" },
      { "en": "Thursday", "kanji": "木曜日", "kana": "もくようび", "romaji": "mokuyoubi" },
      { "en": "Wednesday", "kanji": "水曜日", "kana": "すいようび", "romaji": "suiyoubi" }
    ],
    "place": [
      { "en": "college; university", "kanji": "大学", "kana": "だいがく", "romaji": "daigaku" },
      { "en": "toilet; restroom", "kanji": "トイレ", "kana": "といれ", "romaji": "toire" },
      { "en": "library", "kanji": "図書館", "kana": "としょかん", "romaji": "toshokan" },
      { "en": "post office", "kanji": "郵便局", "kana": "ゆうびんきょく", "romaji": "yuubinkyoku" },
      { "en": "bank", "kanji": "銀行", "kana": "ぎんこう", "romaji": "ginkou" },
      { "en": "school", "kanji": "学校", "kana": "がっこう", "romaji": "gakkou" },
      { "en": "bookstore", "kanji": "本屋", "kana": "ほんや", "romaji": "hon'ya" },
      { "en": "bus stop", "kanji": "バス停", "kana": "ばすてい", "romaji": "basutei" },
      { "en": "hospital", "kanji": "病院", "kana": "びょういん", "romaji": "byouin" },
      { "en": "hotel", "kanji": "ホテル", "kana": "ほてる", "romaji": "hoteru" }
    ],
    "action": [
      { "en": "breakfast", "kanji": "朝ご飯", "kana": "あさごはん", "romaji": "asagohan" },
      { "en": "coffee", "kanji": "コーヒー", "kana": "こーひー", "romaji": "koohee" },
      { "en": "green tea", "kanji": "お茶", "kana": "おちゃ", "romaji": "ocha" },
      { "en": "dinner", "kanji": "晩ご飯", "kana": "ばんごはん", "romaji": "bangohan" },
      { "en": "hamburger", "kanji": "ハンバーガー", "kana": "はんばーがー", "romaji": "hanbaagaa" },
      { "en": "lunch", "kanji": "昼ご飯", "kana": "ひるごはん", "romaji": "hirugohan" },
      { "en": "movie", "kanji": "映画", "kana": "えいが", "romaji": "eiga" },
      { "en": "music", "kanji": "音楽", "kana": "おんがく", "romaji": "ongaku" },
      { "en": "magazine", "kanji": "雑誌", "kana": "ざっし", "romaji": "zasshi" }
    ]
  };

  async function initializeApp() {
    const selectEl = document.getElementById('set-select');
    try {
      const response = await fetch('Test/manifest.json');
      if (!response.ok) throw new Error('Manifest not found');
      const setsList = await response.json();

      selectEl.innerHTML = '';
      setsList.forEach(setItem => {
        const option = document.createElement('option');
        option.value = setItem.file;
        option.textContent = setItem.name;
        selectEl.appendChild(option);
      });

      if (setsList.length > 0) {
        loadSet(setsList[0].file);
      }
    } catch (error) {
      selectEl.innerHTML = '<option value="default">Default Set</option>';
      currentSetData = fallbackData;
    }
  }

  async function loadSet(filePath) {
    if (filePath === 'default') {
      currentSetData = fallbackData;
      return;
    }

    try {
      const response = await fetch(filePath);
      currentSetData = await response.json();
    } catch (error) {
      console.error('Error loading vocabulary set:', error);
    }
  }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function startTest() {
    // Build initial pool of unasked words across all categories
    unaskedWords = [];
    Object.keys(currentSetData).forEach(cat => {
      if (Array.isArray(currentSetData[cat])) {
        currentSetData[cat].forEach(item => {
          unaskedWords.push({ ...item, category: cat });
        });
      }
    });

    if (unaskedWords.length === 0) return;

    // Set desired number of questions (capped by total available unique words)
    const reqAmount = parseInt(document.getElementById('num-questions').value, 10) || 10;
    totalQuestions = Math.min(reqAmount, unaskedWords.length);
    currentQuestionIndex = 0;

    correctResults = [];
    wrongResults = [];

    showScreen('test-screen');
    nextQuestion();
  }

  function nextQuestion() {
    document.getElementById('next-btn').style.display = 'none';

    if (currentQuestionIndex >= totalQuestions || unaskedWords.length === 0) {
      finishTest();
      return;
    }

    currentQuestionIndex++;
    document.getElementById('current-q').innerText = currentQuestionIndex;
    document.getElementById('total-q').innerText = totalQuestions;

    // Pick a random unasked word and remove it from unasked pool
    const targetIdx = Math.floor(Math.random() * unaskedWords.length);
    currentTarget = unaskedWords.splice(targetIdx, 1)[0];

    document.getElementById('prompt-category').innerText = currentTarget.category;
    document.getElementById('prompt-word').innerText = currentTarget.en;

    // Build distractors from the same category first
    const categoryPool = currentSetData[currentTarget.category] || [];
    let distractors = categoryPool.filter(w => w.en !== currentTarget.en);

    // Fallback across all categories if category pool is too small
    if (distractors.length < 3) {
      let globalPool = [];
      Object.keys(currentSetData).forEach(cat => {
        currentSetData[cat].forEach(item => {
          if (item.en !== currentTarget.en) globalPool.push(item);
        });
      });
      distractors = globalPool;
    }

    distractors.sort(() => Math.random() - 0.5);

    let options = [currentTarget, ...distractors.slice(0, 3)];
    options.sort(() => Math.random() - 0.5);

    const grid = document.getElementById('options-grid');
    grid.innerHTML = '';

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `
        <span class="jp-kanji">${opt.kanji}</span>
        <span class="jp-kana">${opt.kana}</span>
        <span class="jp-romaji">${opt.romaji}</span>
      `;
      btn.onclick = () => handleChoice(btn, opt);
      grid.appendChild(btn);
    });
  }

  function handleChoice(selectedBtn, chosenOption) {
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(btn => btn.disabled = true);

    if (chosenOption.en === currentTarget.en) {
      selectedBtn.classList.add('correct');
      correctResults.push(currentTarget);
    } else {
      selectedBtn.classList.add('wrong');
      wrongResults.push(currentTarget);

      // Highlight correct answer
      allBtns.forEach(btn => {
        if (btn.querySelector('.jp-kanji').innerText === currentTarget.kanji) {
          btn.classList.add('correct');
        }
      });
    }

    document.getElementById('next-btn').style.display = 'block';
  }

  function finishTest() {
    showScreen('results-screen');
    document.getElementById('summary-header').innerText = `Completed ${totalQuestions} Questions (${correctResults.length}/${totalQuestions} Correct)`;

    const list = document.getElementById('results-list');
    list.innerHTML = '';

    // Render Correct Words
    correctResults.forEach(item => {
      const card = document.createElement('div');
      card.className = 'result-card correct';
      card.innerHTML = `
        <div class="en">${item.en}</div>
        <div class="jp">${item.kanji}</div>
        <div class="sub">${item.kana} (${item.romaji})</div>
      `;
      list.appendChild(card);
    });

    // Render Wrong Words
    wrongResults.forEach(item => {
      const card = document.createElement('div');
      card.className = 'result-card wrong';
      card.innerHTML = `
        <div class="en">${item.en}</div>
        <div class="jp">${item.kanji}</div>
        <div class="sub">${item.kana} (${item.romaji})</div>
      `;
      list.appendChild(card);
    });
  }

  function restart() {
    showScreen('setup-screen');
  }

  initializeApp();
</script>

</body>
</html>
