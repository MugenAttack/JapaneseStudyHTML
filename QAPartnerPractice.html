<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Q&A Practice Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .japanese-text {
            font-family: 'Hiragino Sans', 'Meiryo', 'Noto Sans JP', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header & Lesson Manifest Selector -->
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-red-500 text-white p-2 rounded-xl shadow-inner">
                    <i class="fa-solid fa-language text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight leading-none">Japanese Info Gap Practice</h1>
                    <p class="text-xs text-slate-400 mt-0.5">Genki Q&A Pair Activity</p>
                </div>
            </div>

            <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700">
                <i class="fa-solid fa-book-open text-xs text-red-400"></i>
                <select id="lessonSelect" onchange="changeLesson(this.value)" class="bg-transparent text-slate-100 text-sm font-medium focus:outline-none cursor-pointer pr-2">
                    <option value="" class="bg-slate-900">Loading lessons...</option>
                </select>
                <button onclick="fetchManifest()" title="Reload Manifest" class="text-slate-400 hover:text-white p-1 transition">
                    <i class="fa-solid fa-rotate-right text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">

        <!-- Toolbar & Seed Controls -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3">
                <!-- Player 1 Seed -->
                <div class="flex items-center space-x-2 bg-indigo-50 border border-indigo-100 px-3 py-1.5 rounded-xl">
                    <span class="text-xs font-bold text-indigo-700">Your Seed (P1):</span>
                    <input type="number" id="p1SeedInput" value="101" class="w-20 px-2 py-0.5 text-sm rounded border border-indigo-200 focus:ring-2 focus:ring-indigo-500 outline-none font-mono text-center">
                    <button onclick="randomizeSeed('p1SeedInput')" class="text-indigo-600 hover:text-indigo-800 p-1" title="Randomize P1 Seed">
                        <i class="fa-solid fa-dice"></i>
                    </button>
                </div>

                <!-- Player 2 Seed -->
                <div class="flex items-center space-x-2 bg-emerald-50 border border-emerald-100 px-3 py-1.5 rounded-xl">
                    <span class="text-xs font-bold text-emerald-700">Partner Seed (P2):</span>
                    <input type="number" id="p2SeedInput" value="202" class="w-20 px-2 py-0.5 text-sm rounded border border-emerald-200 focus:ring-2 focus:ring-emerald-500 outline-none font-mono text-center">
                    <button onclick="randomizeSeed('p2SeedInput')" class="text-emerald-600 hover:text-emerald-800 p-1" title="Randomize P2 Seed">
                        <i class="fa-solid fa-dice"></i>
                    </button>
                    <button onclick="toggleSeedMask()" id="maskBtn" class="text-emerald-700 hover:text-emerald-900 p-1" title="Toggle Seed Mask">
                        <i class="fa-solid fa-eye-slash text-xs"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="generateGame()" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm rounded-xl shadow-sm transition flex items-center space-x-2">
                    <i class="fa-solid fa-arrows-rotate text-xs"></i>
                    <span>Apply Seeds</span>
                </button>
                <button onclick="toggleReveal()" id="revealBtn" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-medium text-sm rounded-xl shadow-sm transition flex items-center space-x-2">
                    <i id="revealBtnIcon" class="fa-solid fa-eye"></i>
                    <span id="revealBtnText">Reveal Answers</span>
                </button>
            </div>
        </div>

        <!-- Side-by-Side Content Area -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <!-- Player 1 Column -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div class="bg-indigo-600 px-5 py-3.5 text-white flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-user text-indigo-200"></i>
                        <h2 class="font-bold text-base">Your Info (P1)</h2>
                    </div>
                </div>
                <div class="p-5 flex-1 space-y-4" id="p1Container">
                    <!-- Dynamic P1 persona items generated here -->
                </div>
            </div>

            <!-- Player 2 Column -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div class="bg-emerald-600 px-5 py-3.5 text-white flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-user-group text-emerald-200"></i>
                        <h2 class="font-bold text-base">Partner Info (P2)</h2>
                    </div>
                </div>
                <div class="p-5 flex-1 space-y-4" id="p2Container">
                    <!-- Dynamic P2 note log & reveal cards generated here -->
                </div>
            </div>

        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        let currentManifest = [];
        let currentDataset = null;
        let p1Data = {};
        let p2Data = {};
        let isRevealed = false;
        let hideP2Seed = false;

        // Mulberry32 Pseudorandom Number Generator
        function mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            }
        }

        // Default Genki Lesson fallback dataset
        const fallbackDataset = {
            "categories": ["name", "age", "occupation", "major"],
            "name": {
                "label": "Name",
                "options": [
                    { "val": "Ken", "jp": "ケン", "reading": "ケン", "romaji": "Ken" },
                    { "val": "Mary", "jp": "メアリー", "reading": "メアリー", "romaji": "Mearī" },
                    { "val": "Takeshi", "jp": "たけし", "reading": "たけし", "romaji": "Takeshi" },
                    { "val": "Sora", "jp": "空", "reading": "そら", "romaji": "Sora" }
                ]
            },
            "age": {
                "label": "Age",
                "options": [
                    { "val": "19 years old", "jp": "19歳", "reading": "じゅうきゅうさい", "romaji": "Jūkyū sai" },
                    { "val": "20 years old", "jp": "20歳", "reading": "はたち", "romaji": "Hatachi" },
                    { "val": "21 years old", "jp": "21歳", "reading": "にじゅういっさい", "romaji": "Nijūissai" },
                    { "val": "22 years old", "jp": "22歳", "reading": "にじゅうにさい", "romaji": "Nijūni sai" }
                ]
            },
            "occupation": {
                "label": "Occupation",
                "options": [
                    { "val": "Student", "jp": "学生", "reading": "がくせい", "romaji": "Gakusei" },
                    { "val": "Teacher", "jp": "先生", "reading": "せんせい", "romaji": "Sensei" },
                    { "val": "Company Employee", "jp": "会社員", "reading": "かいしゃいん", "romaji": "Kaishain" }
                ]
            },
            "major": {
                "label": "Major",
                "options": [
                    { "val": "Japanese Language", "jp": "日本語", "reading": "にほんご", "romaji": "Nihongo" },
                    { "val": "Economics", "jp": "経済", "reading": "けいざい", "romaji": "Keizai" },
                    { "val": "Computer Science", "jp": "情報科学", "reading": "じょうほうかがく", "romaji": "Jōhō kagaku" }
                ]
            }
        };

        window.onload = function() {
            fetchManifest();
        };

        async function fetchManifest() {
            try {
                const response = await fetch('QAPartnerPractice/manifest.json');
                if (!response.ok) throw new Error('Manifest unavailable');
                currentManifest = await response.json();
                populateLessonDropdown(currentManifest);
                if (currentManifest.length > 0) {
                    await changeLesson(currentManifest[0].file);
                }
            } catch (err) {
                populateFallbackDropdown();
                currentDataset = fallbackDataset;
                generateGame();
            }
        }

        function populateLessonDropdown(manifest) {
            const select = document.getElementById('lessonSelect');
            select.innerHTML = '';
            manifest.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.file;
                opt.textContent = item.title || item.id;
                opt.className = "bg-slate-900";
                select.appendChild(opt);
            });
        }

        function populateFallbackDropdown() {
            const select = document.getElementById('lessonSelect');
            select.innerHTML = '<option value="fallback" class="bg-slate-900">Genki Lesson 1</option>';
        }

        async function changeLesson(filePath) {
            if (filePath === 'fallback') {
                currentDataset = fallbackDataset;
                generateGame();
                return;
            }
            try {
                const res = await fetch(filePath);
                if (!res.ok) throw new Error(`Failed to load ${filePath}`);
                currentDataset = await res.json();
                generateGame();
            } catch (err) {
                currentDataset = fallbackDataset;
                generateGame();
            }
        }

        function randomizeSeed(inputId) {
            document.getElementById(inputId).value = Math.floor(Math.random() * 900) + 100;
            generateGame();
        }

        function toggleSeedMask() {
            hideP2Seed = !hideP2Seed;
            const seedInput = document.getElementById('p2SeedInput');
            const maskBtn = document.getElementById('maskBtn');
            if (hideP2Seed) {
                seedInput.type = 'password';
                maskBtn.innerHTML = '<i class="fa-solid fa-eye text-xs"></i>';
            } else {
                seedInput.type = 'number';
                maskBtn.innerHTML = '<i class="fa-solid fa-eye-slash text-xs"></i>';
            }
        }

        function evaluateSeed(seed, dataset) {
            const rng = mulberry32(parseInt(seed) || 123);
            const result = {};
            
            if (!dataset || !dataset.categories) return result;

            // Sequential independent draw per category
            dataset.categories.forEach(catKey => {
                const catData = dataset[catKey];
                if (catData && catData.options && catData.options.length > 0) {
                    const randomVal = rng();
                    const chosenIdx = Math.floor(randomVal * catData.options.length);
                    result[catKey] = {
                        label: catData.label || catKey,
                        item: catData.options[chosenIdx]
                    };
                }
            });
            return result;
        }

        // Formats Japanese text strictly as Kanji (Hiragana)
        function formatJapaneseText(item) {
            if (!item) return '';
            const mainText = item.jp || '';
            const reading = item.reading || item.furigana || '';
            
            // If reading exists and differs from main text, format as "Kanji (reading)"
            if (reading && reading !== mainText) {
                return `${mainText} (${reading})`;
            }
            return mainText;
        }

        function generateGame() {
            isRevealed = false;
            updateRevealBtnUI();

            const p1Seed = document.getElementById('p1SeedInput').value;
            const p2Seed = document.getElementById('p2SeedInput').value;

            p1Data = evaluateSeed(p1Seed, currentDataset);
            p2Data = evaluateSeed(p2Seed, currentDataset);

            renderP1();
            renderP2();
        }

        function renderP1() {
            const container = document.getElementById('p1Container');
            container.innerHTML = '';

            if (!currentDataset || !currentDataset.categories) return;

            currentDataset.categories.forEach(key => {
                const data = p1Data[key];
                if (!data) return;

                const card = document.createElement('div');
                card.className = "bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-1.5";
                
                const formattedText = formatJapaneseText(data.item);

                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">${data.label}</span>
                        <button onclick="speakText('${escapeQuotes(data.item.jp)}')" class="text-indigo-600 hover:text-indigo-800 p-1.5 rounded-lg hover:bg-indigo-100 transition" title="Listen Word">
                            <i class="fa-solid fa-volume-high text-xs"></i>
                        </button>
                    </div>
                    <div class="text-lg font-bold text-slate-800 japanese-text">${formattedText}</div>
                    <div class="text-xs text-slate-500 font-medium">${data.item.romaji || ''}</div>
                    <div class="text-xs font-semibold text-indigo-700 bg-indigo-50/50 inline-block px-2 py-0.5 rounded border border-indigo-100">${data.item.val}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderP2() {
            const container = document.getElementById('p2Container');
            container.innerHTML = '';

            if (!currentDataset || !currentDataset.categories) return;

            currentDataset.categories.forEach(key => {
                const data = p2Data[key];
                if (!data) return;

                const existingInput = document.getElementById(`note-${key}`)?.value || '';

                const card = document.createElement('div');
                card.className = "bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3";

                const formattedText = formatJapaneseText(data.item);

                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">${data.label}</span>
                    </div>

                    <div>
                        <input type="text" id="note-${key}" value="${existingInput}" placeholder="Type partner answer..." class="w-full text-sm px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
                    </div>

                    <div id="reveal-${key}" class="${isRevealed ? '' : 'hidden'} bg-amber-50 p-3 rounded-lg border border-amber-200 space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-amber-800">True Answer:</span>
                            <button onclick="speakText('${escapeQuotes(data.item.jp)}')" class="text-amber-700 hover:text-amber-900 p-1" title="Listen Word">
                                <i class="fa-solid fa-volume-high text-xs"></i>
                            </button>
                        </div>
                        <div class="text-base font-bold text-slate-800 japanese-text">${formattedText}</div>
                        <div class="text-xs text-slate-500 font-medium">${data.item.romaji || ''}</div>
                        <div class="text-xs font-semibold text-emerald-700">${data.item.val}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleReveal() {
            isRevealed = !isRevealed;
            updateRevealBtnUI();
            
            if (!currentDataset || !currentDataset.categories) return;

            currentDataset.categories.forEach(key => {
                const revealBox = document.getElementById(`reveal-${key}`);
                if (revealBox) {
                    if (isRevealed) {
                        revealBox.classList.remove('hidden');
                    } else {
                        revealBox.classList.add('hidden');
                    }
                }
            });
        }

        function updateRevealBtnUI() {
            const btnText = document.getElementById('revealBtnText');
            const btnIcon = document.getElementById('revealBtnIcon');
            const btn = document.getElementById('revealBtn');

            if (isRevealed) {
                btnText.textContent = "Hide Answers";
                btnIcon.className = "fa-solid fa-eye-slash";
                btn.className = "px-4 py-2 bg-slate-600 hover:bg-slate-700 text-white font-medium text-sm rounded-xl shadow-sm transition flex items-center space-x-2";
            } else {
                btnText.textContent = "Reveal Answers";
                btnIcon.className = "fa-solid fa-eye";
                btn.className = "px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-medium text-sm rounded-xl shadow-sm transition flex items-center space-x-2";
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function escapeQuotes(str) {
            return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
