<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verb Practice</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --accent: #2563eb;
      --text: #0f172a;
      --border: #cbd5e1;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px 12px;
      margin: 0;
    }

    .app-container {
      background: var(--card);
      width: 100%;
      max-width: 680px;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
    }

    h1.title {
      text-align: center;
      font-size: 1.5rem;
      margin: 0 0 20px 0;
    }

    .controls-panel {
      display: flex;
      gap: 24px;
      justify-content: center;
      background: #f1f5f9;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .slot-box {
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #fff;
      transition: all 0.2s ease;
    }

    .slot-box.disabled {
      opacity: 0.3;
      background: #e2e8f0;
      pointer-events: none;
    }

    .slot-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #64748b;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .slot-img {
      max-width: 50px;
      max-height: 50px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .slot-text {
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .answer-wrapper {
      margin-top: 20px;
    }

    .answer-panel {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 16px;
      display: none;
    }

    .answer-panel.visible {
      display: block;
    }

    .answer-line {
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    .answer-line:last-child {
      margin-bottom: 0;
    }

    .answer-label {
      font-weight: bold;
      color: var(--accent);
      margin-right: 8px;
      display: inline-block;
      width: 80px;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-reveal { background: #0284c7; color: white; }
    .btn-reveal:hover { background: #0369a1; }

    .btn-generate { background: var(--accent); color: white; }
    .btn-generate:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<div class="app-container">
  <h1 class="title">Verb Practice</h1>

  <div class="controls-panel">
    <label class="toggle-label">
      <input type="checkbox" id="toggle-time" checked onchange="updateApp()"> Time
    </label>

    <label class="toggle-label">
      <input type="checkbox" id="toggle-place" checked onchange="updateApp()"> Place
    </label>
  </div>

  <div class="slots-grid">
    <div id="box-time" class="slot-box">
      <span class="slot-title">Time</span>
      <div id="content-time">---</div>
    </div>

    <div id="box-place" class="slot-box">
      <span class="slot-title">Place</span>
      <div id="content-place">---</div>
    </div>

    <div id="box-verb" class="slot-box">
      <span class="slot-title">Verb Action</span>
      <div id="content-verb">---</div>
    </div>
  </div>

  <div class="button-group">
    <button class="btn btn-reveal" onclick="toggleAnswer()">Reveal Answer</button>
    <button class="btn btn-generate" onclick="generateNewCombo()">Generate Combo</button>
  </div>

  <div class="answer-wrapper">
    <div id="answer-panel" class="answer-panel">
      <div class="answer-line"><span class="answer-label">Kanji:</span><span id="ans-kanji">---</span></div>
      <div class="answer-line"><span class="answer-label">Hiragana:</span><span id="ans-hiragana">---</span></div>
      <div class="answer-line"><span class="answer-label">Romaji:</span><span id="ans-romaji">---</span></div>
    </div>
  </div>
</div>

<script>
  let appData = { times: [], places: [], verbs: [] };
  let activeCombo = { time: null, place: null, verb: null };
  let isAnswerRevealed = false;

  async function loadData() {
    try {
      const response = await fetch('./appData.json');
      appData = await response.json();
      generateNewCombo();
    } catch (error) {
      console.error("Error loading appData.json:", error);
    }
  }

  function getRandom(arr) {
    if (!arr || arr.length === 0) return null;
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function generateNewCombo() {
    activeCombo.time = getRandom(appData.times);
    activeCombo.place = getRandom(appData.places);
    activeCombo.verb = getRandom(appData.verbs);
    
    isAnswerRevealed = false;
    document.getElementById("answer-panel").classList.remove("visible");
    
    updateApp();
  }

  function toggleAnswer() {
    isAnswerRevealed = !isAnswerRevealed;
    document.getElementById("answer-panel").classList.toggle("visible", isAnswerRevealed);
  }

  function updateApp() {
    if (!activeCombo.verb) return;

    const timeEnabled = document.getElementById("toggle-time").checked;
    let placeEnabled = document.getElementById("toggle-place").checked;

    if (!activeCombo.verb.allowsPlace) {
      placeEnabled = false;
    }

    // Pass the English (.en) value to display inside the slots
    toggleBox("box-time", "content-time", activeCombo.time, timeEnabled);
    toggleBox("box-place", "content-place", activeCombo.place, placeEnabled);
    toggleBox("box-verb", "content-verb", activeCombo.verb, true);

    let kanjiParts = [];
    let hiraParts = [];
    let romajiParts = [];

    if (timeEnabled && activeCombo.time) {
      kanjiParts.push(activeCombo.time.kanji);
      hiraParts.push(activeCombo.time.jp);
      romajiParts.push(activeCombo.time.romaji);
    }

    if (placeEnabled && activeCombo.place) {
      kanjiParts.push(activeCombo.place.kanji);
      hiraParts.push(activeCombo.place.jp);
      romajiParts.push(activeCombo.place.romaji);
    }

    if (activeCombo.verb) {
      kanjiParts.push(activeCombo.verb.kanji);
      hiraParts.push(activeCombo.verb.jp);
      romajiParts.push(activeCombo.verb.romaji);
    }

    document.getElementById("ans-kanji").innerText = kanjiParts.join(" ") + "。";
    document.getElementById("ans-hiragana").innerText = hiraParts.join(" ") + "。";
    document.getElementById("ans-romaji").innerText = romajiParts.join(" ");
  }

  function toggleBox(boxId, contentId, item, isEnabled) {
    const box = document.getElementById(boxId);
    const content = document.getElementById(contentId);

    if (isEnabled && item) {
      box.classList.remove("disabled");
      let imgHTML = item.img ? `<img src="${item.img}" class="slot-img" alt="">` : '';
      // Displaying the English text inside the box
      content.innerHTML = `${imgHTML}<div class="slot-text">${item.en}</div>`;
    } else {
      box.classList.add("disabled");
      content.innerHTML = `<div class="slot-text">---</div>`;
    }
  }

  loadData();
</script>

</body>
</html>
