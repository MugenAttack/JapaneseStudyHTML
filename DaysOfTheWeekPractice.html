<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Days of the Week Practice</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 950px;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: #2c3e50;
        }

        .instruction {
            font-size: 1.15rem;
            margin-bottom: 25px;
            color: #34495e;
            font-weight: 500;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        @media (max-width: 850px) {
            .days-grid {
                grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            }
        }

        .day-card {
            background-color: #f8fbff;
            border: 2px solid #e0e0e0;
            border-radius: var(--border-radius);
            padding: 18px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 140px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .day-card .english-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .day-card .kanji-text {
            font-size: 1.6rem;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .day-card .hiragana-text {
            font-size: 0.95rem;
            color: #4a90e2;
            margin-bottom: 2px;
        }

        .day-card .romaji-text {
            font-size: 0.85rem;
            color: #888888;
            font-style: italic;
        }

        /* Hidden Card Style */
        .day-card.hidden-card {
            background-color: #ffffff;
            border: 2px dashed var(--primary-color);
            cursor: pointer;
        }

        .day-card.hidden-card:hover {
            background-color: #eef2f7;
            transform: translateY(-3px);
        }

        .day-card.hidden-card .question-mark {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 10px;
        }

        /* Revealed Card Style */
        .day-card.revealed {
            border: 2px solid var(--success-color) !important;
            background-color: #e8f8f0 !important;
            animation: popIn 0.3s ease-out;
        }

        .day-card.revealed .kanji-text {
            color: var(--success-color);
        }

        @keyframes popIn {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .feedback {
            min-height: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .next-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.05rem;
            border-radius: 25px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
        }

        .next-btn:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Japanese Days of the Week</h1>

    <div class="instruction">Click the missing day to reveal answer</div>

    <div class="days-grid" id="days-grid">
        <!-- Weekday cards dynamically generated here -->
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Round →</button>
</div>

<script>
    const daysData = [
        { english: "Sun", fullEnglish: "Sunday", kanji: "日曜日", hiragana: "にちようび", romaji: "Nichiyoubi" },
        { english: "Mon", fullEnglish: "Monday", kanji: "月曜日", hiragana: "げつようび", romaji: "Getsuyoubi" },
        { english: "Tue", fullEnglish: "Tuesday", kanji: "火曜日", hiragana: "かようび", romaji: "Kayoubi" },
        { english: "Wed", fullEnglish: "Wednesday", kanji: "水曜日", hiragana: "すいようび", romaji: "Suiyoubi" },
        { english: "Thu", fullEnglish: "Thursday", kanji: "木曜日", hiragana: "もくようび", romaji: "Mokuyoubi" },
        { english: "Fri", fullEnglish: "Friday", kanji: "金曜日", hiragana: "きんようび", romaji: "Kinyoubi" },
        { english: "Sat", fullEnglish: "Saturday", kanji: "土曜日", hiragana: "どようび", romaji: "Doyoubi" }
    ];

    let hiddenIndex = -1;
    let revealed = false;

    function nextQuestion() {
        revealed = false;
        document.getElementById('feedback').innerText = '';
        document.getElementById('next-btn').style.display = 'none';

        // Select random day (0 to 6) to hide
        hiddenIndex = Math.floor(Math.random() * daysData.length);

        renderGrid();
    }

    function renderGrid() {
        const grid = document.getElementById('days-grid');
        grid.innerHTML = '';

        daysData.forEach((day, index) => {
            const card = document.createElement('div');
            card.className = 'day-card';

            const label = document.createElement('div');
            label.className = 'english-label';
            label.innerText = day.english;
            card.appendChild(label);

            if (index === hiddenIndex) {
                card.classList.add('hidden-card');

                const qMark = document.createElement('div');
                qMark.className = 'question-mark';
                qMark.innerText = '?';
                card.appendChild(qMark);

                card.onclick = () => revealDay(card, day);
            } else {
                appendJapaneseDetails(card, day);
            }

            grid.appendChild(card);
        });
    }

    function appendJapaneseDetails(container, day) {
        const kanji = document.createElement('div');
        kanji.className = 'kanji-text';
        kanji.innerText = day.kanji;

        const hiragana = document.createElement('div');
        hiragana.className = 'hiragana-text';
        hiragana.innerText = day.hiragana;

        const romaji = document.createElement('div');
        romaji.className = 'romaji-text';
        romaji.innerText = day.romaji;

        container.appendChild(kanji);
        container.appendChild(hiragana);
        container.appendChild(romaji);
    }

    function revealDay(card, day) {
        if (revealed) return;
        revealed = true;

        // Remove question mark and append Japanese text
        const qMark = card.querySelector('.question-mark');
        if (qMark) qMark.remove();

        appendJapaneseDetails(card, day);

        card.classList.remove('hidden-card');
        card.classList.add('revealed');

        // Update feedback
        document.getElementById('feedback').innerText = `✨ ${day.fullEnglish}: ${day.kanji} (${day.romaji})`;
        document.getElementById('feedback').style.color = 'var(--success-color)';

        document.getElementById('next-btn').style.display = 'block';
    }

    // Initialize on load
    nextQuestion();
</script>

</body>
</html>
