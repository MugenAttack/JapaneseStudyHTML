<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Study Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        jp: ['Noto Sans JP', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-gray-800 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <main class="w-full max-w-md bg-white border border-gray-200 rounded-2xl p-6 sm:p-8 shadow-sm">
        
        <!-- Header (Title only) -->
        <header class="text-center mb-6">
            <h1 class="text-xl font-bold text-gray-900">Japanese Study Index</h1>
        </header>

        <!-- Dynamic Navigation Links Container -->
        <nav id="linksContainer" class="space-y-3" aria-label="Practice Topics">
            <!-- Buttons will be generated dynamically by JavaScript below -->
        </nav>

    </main>

    <!-- AI Disclaimer Footer -->
    <footer class="mt-6 text-center">
        <p class="text-xs text-gray-400">Disclaimer: This index page and its linked practice pages were generated by AI.</p>
    </footer>

        // Edit, add, or remove items in this array to update your index links!
        // =========================================================================

            {

                kanji: "年齢",
                hiragana: "ねんれい",

            },
            {

                // SVG Path for Calendar Icon

            },
            {

            },
            {

                // SVG Path for Hash/Number Icon

            {

            }
        ];

        function renderLinks() {
            const container = document.getElementById('linksContainer');
            
            // Map over the studyPages array and create button HTML for each entry
            container.innerHTML = studyPages.map(page => `
                <a href="${page.url}" class="flex items-center justify-between p-3.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-xl transition-colors">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-blue-100 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${page.iconPath}"></path>
                        </svg>
                        <div>
                            <div class="text-sm font-semibold leading-tight">${page.title}</div>
                            <div class="text-xs text-blue-100 font-jp mt-0.5">${page.kanji} (${page.hiragana} / ${page.romaji})</div>
                        </div>
                    </div>
                    <svg class="w-4 h-4 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </a>
            `).join('');
        }

        // Execute rendering when DOM is ready
        document.addEventListener('DOMContentLoaded', renderLinks);
    </script>

</body>
</html>
